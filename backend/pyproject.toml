[project]
name = "typeform-clone-backend"
version = "1.0.0"
description = "FastAPI backend for Typeform Clone"
requires-python = ">=3.12"
dependencies = [
    ""fastapi[standard]>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.12.0",
]

[tool.fastapi]
entrypoint = "app.main:app"